<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Hi, I'm Muskan. I make the web move.">
  <defs>
    <clipPath id="frame"><rect width="1200" height="320" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="#0B0A10"/>

    <!-- orbit rings, right side -->
    <g opacity="0.9" fill="none" stroke-width="1">
      <circle cx="960" cy="160" r="300" stroke="#1C1930"/>
      <circle cx="960" cy="160" r="230" stroke="#221D3B"/>
      <circle cx="960" cy="160" r="160" stroke="#2A2348"/>
      <ellipse cx="960" cy="160" rx="300" ry="92" stroke="#1F1B36"/>
      <ellipse cx="960" cy="160" rx="92" ry="300" stroke="#1F1B36"/>
    </g>
    <path d="M960 -140 A300 300 0 0 1 1260 160" fill="none" stroke="#B9A5FF" stroke-width="2" stroke-linecap="round"/>
    <path d="M960 0 A160 160 0 0 0 800 160" fill="none" stroke="#A5E9FF" stroke-width="2" stroke-linecap="round"/>
    <circle cx="1260" cy="160" r="5" fill="#B9A5FF"/>
    <circle cx="800" cy="160" r="4" fill="#A5E9FF"/>

    <!-- faint stars -->
    <g fill="#302A52">
      <circle cx="120" cy="40" r="2"/>
      <circle cx="610" cy="48" r="2"/>
      <circle cx="80" cy="280" r="2"/>
      <circle cx="420" cy="292" r="2"/>
      <circle cx="1150" cy="290" r="2"/>
      <circle cx="700" cy="250" r="2"/>
    </g>

    <!-- label -->
    <circle cx="72" cy="82" r="4" fill="#B9A5FF"/>
    <text x="88" y="87" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" letter-spacing="2.4" fill="#B9A5FF">FULL-STACK ENGINEER · GURUGRAM</text>

    <!-- headline -->
    <text x="66" y="160" font-family="'Bricolage Grotesque', 'Sora', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="62" font-weight="700" letter-spacing="-2.4" fill="#F1EFFA">Hi, I'm Muskan.</text>
    <text x="66" y="226" font-family="'Bricolage Grotesque', 'Sora', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="62" font-weight="700" letter-spacing="-2.4" fill="#F1EFFA">I make the web <tspan fill="#B9A5FF">move.</tspan></text>

    <!-- sub line -->
    <text x="68" y="272" font-family="'Sora', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#A8A2C6">React · TypeScript · Node.js · the parts in between</text>

    <!-- bottom-right meta -->
    <text x="1132" y="290" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" letter-spacing="1.6" fill="#7C759B">GITHUB.COM/MUSKANGOSAIN</text>
  </g>
</svg>
